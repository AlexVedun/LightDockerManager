<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4faf8"/>
      <stop offset="1" stop-color="#dcf1e9"/>
    </linearGradient>
    <linearGradient id="featherGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#8ef0d6"/>
      <stop offset="1" stop-color="#3bb797"/>
    </linearGradient>
    <radialGradient id="corner" cx="0.22" cy="0.16" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="114" fill="url(#corner)"/>

  <!-- feather, background -->
  <g transform="translate(130,110) rotate(-28) scale(1.45)">
    <line x1="0" y1="205" x2="0" y2="232" stroke="#6fae9c" stroke-width="4" stroke-linecap="round"/>
    <path d="M0,0 C8,26 22,56 30,96 C36,128 30,158 20,180 C14,193 8,200 0,205
             C-8,200 -14,193 -18,180 C-24,158 -26,128 -20,96 C-14,56 -6,26 0,0 Z"
          fill="url(#featherGrad)" stroke="#2f8f76" stroke-width="2.5"/>
    <path d="M0,0 Q6,100 0,205" fill="none" stroke="#2f8f76" stroke-width="2.5" opacity="0.8"/>
    <line x1="0" y1="20"  x2="8.5"  y2="4"   stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="20"  x2="-5"   y2="4"   stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="40"  x2="15"   y2="24"  stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="40"  x2="-8.5" y2="24"  stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="60"  x2="22"   y2="44"  stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="60"  x2="-13"  y2="44"  stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="80"  x2="27"   y2="64"  stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="80"  x2="-16"  y2="64"  stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="100" x2="30"   y2="84"  stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="100" x2="-19"  y2="84"  stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="120" x2="28"   y2="104" stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="120" x2="-18"  y2="104" stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="140" x2="25"   y2="124" stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="140" x2="-16"  y2="124" stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="160" x2="20"   y2="144" stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="160" x2="-14"  y2="144" stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="180" x2="13"   y2="164" stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="180" x2="-9"   y2="164" stroke="#2f8f76" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- container B: smaller, set back -->
  <g stroke="#294254" stroke-width="5" stroke-linejoin="round">
    <polygon points="250,297 300,330 400,297 350,264" fill="#86b3c4"/>
    <polygon points="250,297 300,330 300,394 250,361" fill="#5c8ea3"/>
    <polygon points="300,330 400,297 400,361 300,394" fill="#3f6a7d"/>
  </g>

  <!-- container A: larger, in front -->
  <g stroke="#294254" stroke-width="6" stroke-linejoin="round">
    <polygon points="80,364 150,410 290,364 220,318" fill="#6fa2b8"/>
    <polygon points="80,364 150,410 150,500 80,454" fill="#4f7c92"/>
    <polygon points="150,410 290,364 290,454 150,500" fill="#33586c"/>
  </g>
  <g stroke="#22384a" stroke-width="3" opacity="0.4" stroke-linecap="round">
    <line x1="103" y1="379" x2="103" y2="469"/>
    <line x1="126" y1="394" x2="126" y2="484"/>
    <line x1="196" y1="395" x2="196" y2="485"/>
    <line x1="242" y1="380" x2="242" y2="470"/>
  </g>
</svg>
